[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "archonix"
version = "0.1.0"
description = "Portable AI software engineering skill system: from product understanding to production-ready software."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# referencing is imported directly (schema registry), so it is declared explicitly even
# though jsonschema also depends on it.
dependencies = ["jsonschema>=4.18", "referencing>=0.28.4"]
keywords = ["agent-skills", "code-review", "security", "testing", "release-readiness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/ayushsaxenagithub/Archonix"

[project.scripts]
archonix = "archonix.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-jsonschema",
    # Optional scanners used by the real-tool integration tests.
    "bandit>=1.7",
    "vulture>=2.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archonix"]

[tool.hatch.build.targets.wheel.force-include]
"skills/archonix" = "archonix/_bundled/skills/archonix"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "docs", "examples", "adapters", "scripts", "README.md", "LICENSE", "AGENTS.md", "CONTRIBUTING.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs a real external tool; skipped when the tool is not installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Adapter classes declare constant metadata tables as class attributes.
"src/archonix/adapters/*" = ["RUF012"]
"tests/**" = ["S101", "S105", "S106", "S108", "S310", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/archonix"]
