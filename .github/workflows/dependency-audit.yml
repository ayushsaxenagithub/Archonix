name: Dependency audit

# Network-dependent (queries vulnerability databases), so it does not gate every pull
# request: it runs weekly, on demand, and when dependency declarations change.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dependency-audit.yml"
      - "src/archonix/adapters/dependency_tools.py"
      - "tests/test_osv_scanner.py"
  push:
    branches: [main]
    paths: ["pyproject.toml", "uv.lock"]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Audit locked runtime and development dependencies
        run: |
          uv export --format requirements-txt --frozen --no-emit-project --all-groups > requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --progress-spinner off -r requirements-audit.txt

  osv-scanner-adapter:
    name: osv-scanner adapter (real tool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: "2.7.0"
      # SHA-256 of osv-scanner_linux_amd64 from the release's osv-scanner_SHA256SUMS.
      OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner (checksum-verified release binary)
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
          mkdir -p "$RUNNER_TEMP/bin" && mv osv-scanner "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Verify the osv-scanner adapter against the real tool (queries osv.dev)
        env:
          ARCHONIX_NETWORK_TESTS: "1"
        run: |
          uv sync --locked
          uv run pytest -m integration -k osv -q -rs
