name: Dependency audit

# Network-dependent (queries vulnerability databases), so it does not gate every pull
# request: it runs weekly, on demand, and when dependency declarations change.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: ["pyproject.toml", "uv.lock", ".github/workflows/dependency-audit.yml"]
  push:
    branches: [main]
    paths: ["pyproject.toml", "uv.lock"]

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Audit locked runtime and development dependencies
        run: |
          uv export --format requirements-txt --frozen --no-emit-project --all-groups > requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --progress-spinner off -r requirements-audit.txt
