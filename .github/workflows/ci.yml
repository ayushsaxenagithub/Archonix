name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Fixture tests (offline)
        run: uv run pytest -m "not integration" -q
      - name: Real-tool integration tests (skips tools that are not installed)
        run: uv run pytest -m integration -q -rs
      - name: Validate skill, schemas and examples
        run: |
          uv run archonix skill validate
          for f in examples/reports/*.json examples/requirements/*.json; do uv run archonix validate "$f"; done
          uv run archonix requirements validate examples/requirements/ledger.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel in an isolated environment
        run: |
          python -m venv /tmp/isolated
          /tmp/isolated/bin/pip install dist/*.whl
          cd /tmp
          /tmp/isolated/bin/archonix --version
          /tmp/isolated/bin/archonix skill validate
          /tmp/isolated/bin/archonix schema list
          /tmp/isolated/bin/archonix inventory "$GITHUB_WORKSPACE/examples/python-service" --format json > inv.json
          /tmp/isolated/bin/archonix validate inv.json
          /tmp/isolated/bin/archonix install --assistant claude --scope project --project-dir /tmp/proj
      - name: Install real tools for the acceptance suite
        run: uv sync --locked
      # Acceptance criteria AC-1..AC-11 against the installed wheel (acceptance/README.md).
      # Tools that are not installed here (e.g. gitleaks) are reported as SKIP.
      - name: CLI acceptance suite
        run: |
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" python acceptance/cli_acceptance.py \
            --archonix /tmp/isolated/bin/archonix --json-out acceptance-results.json

  docs:
    name: markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Formatting rules live in .markdownlint-cli2.jsonc. Internal links are checked
      # offline by tests/test_docs_consistency.py in the test job.
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the merge commit
          persist-credentials: false
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan repository history
        run: gitleaks git --no-banner --redact --exit-code 1 .
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Verify the gitleaks adapter against the real tool
        run: |
          uv sync --locked
          uv run pytest -m integration -k gitleaks -q -rs

  semgrep:
    name: semgrep adapter (real tool)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Install semgrep (pinned) in an isolated tool environment
        run: uv tool install semgrep==1.182.0
      # Rules are written into the test repository, so the scan itself is offline
      # (metrics and version checks are disabled by the adapter).
      - name: Verify the semgrep-local adapter against the real tool
        run: |
          uv sync --locked
          uv run pytest -m integration -k semgrep -q -rs
