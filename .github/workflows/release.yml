name: Release

# Publishes to PyPI with trusted publishing (OIDC); no API token is stored in GitHub.
# Nothing is published until a maintainer publishes a GitHub release, and publishing
# only works after the one-time setup in docs/releasing.md (PyPI trusted publisher +
# "pypi"/"testpypi" GitHub environments, which can require manual approval).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index for a manual run"
        type: choice
        options: [testpypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "tag $TAG does not match version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: Smoke-test the wheel in an isolated environment
        run: |
          python -m venv /tmp/isolated
          /tmp/isolated/bin/pip install dist/*.whl
          cd /tmp
          /tmp/isolated/bin/archonix --version
          /tmp/isolated/bin/archonix skill validate
          /tmp/isolated/bin/archonix inventory "$GITHUB_WORKSPACE/examples/python-service" --format json > inv.json
          /tmp/isolated/bin/archonix validate inv.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/archonix/
    permissions:
      id-token: write # trusted publishing; the only elevated permission, in this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/archonix/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
