name: Feature request
description: Propose a new capability, adapter, or workflow improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Commands, output or behaviour you would expect.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Permissions and trust impact
      description: Would this run repository code, use the network, write files, or need new permissions? See docs/trust-model.md.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps Archonix offline-by-default and free of mandatory API keys or hosted services.
          required: true
