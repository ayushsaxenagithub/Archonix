name: Bug report
description: Something in the CLI, a schema, the installer or the skill behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include real secrets, private code or customer data.**
        Security vulnerabilities belong in a private report — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Observed behaviour, including exit code and relevant output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands, ideally against a synthetic repository or one of `examples/`.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Archonix version
      description: Output of `archonix --version` (or the commit SHA).
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and versions of any external tool involved (e.g. `ruff --version`).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [inventory, checks / adapters, reports / schemas, redaction, permissions / config, installer, readiness, perf, skill content, docs, other]
    validations:
      required: true
