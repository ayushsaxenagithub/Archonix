# Example release readiness policy. Rules not listed here are not evaluated.
name = "example-release-policy"

[rules]
required_checks = ["ruff", "bandit", "pytest"]
max_severity = "medium"          # open findings more severe than this fail the assessment
require_tests = true
require_revision = true
require_clean_worktree = true
require_must_requirements_verified = true
allow_unparsed_checks = false
